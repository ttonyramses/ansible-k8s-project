---
- name: Attendre que tous les pods dans le namespace soient prêts (3 vérifications)
  block:
    - name: Effectuer {{ wait_iterations | default(3) }} vérifications
      shell: >
        kubectl wait --for=condition=ready pods --all -n {{ wait_namespace }} --timeout={{ wait_timeout | default('120s') }}
      register: wait_result
      environment:
        KUBECONFIG: "{{ ansible_facts['user_dir'] }}/.kube/config"
      loop: "{{ range(1, (wait_iterations | default(3)) + 1) | list }}"
      loop_control:
        label: "Vérification {{ item }} sur {{ wait_iterations | default(3) }}"
        pause: "{{ wait_pause | default(10) }}"
      
    - name: Afficher le résultat de la dernière vérification
      debug:
        msg: "Résultat final après {{ wait_iterations  | default(3) }}  vérifications: {{ wait_result.results[-1].stdout_lines }}"
      
  rescue:
    - name: Afficher l'état des pods en cas d'échec
      shell: kubectl get pods -n {{ wait_namespace }}
      register: pods_status
      environment:
        KUBECONFIG: "{{ ansible_facts['user_dir'] }}/.kube/config"
      
    - name: Afficher les pods problématiques
      debug:
        msg: "Certains pods ne sont pas prêts dans le namespace {{ wait_namespace }}: {{ pods_status.stdout_lines }}"


